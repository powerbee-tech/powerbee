<!DOCTYPE html>
<!--
  Source for assets/og.png — the link-preview card.
  Render at exactly 1200x630 and screenshot it, then save over assets/og.png.

  Same lockup as the title slide and the gate: interlocking rings + PowerBee
  wordmark. Previews are fetched by third-party servers, so no figures, patents
  or technical claims belong here.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black: #000000;
  --slate: #4C5A66;
  --white: #F7FFFF;
  --gray:  #AABBBD;
  --red:   #FF073A;
}

body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: var(--black);
  font-family: 'Sora', sans-serif;
  color: var(--white);
}

.card {
  position: relative;
  width: 1200px;
  height: 630px;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(52% 42% at 92% -6%, rgba(255, 7, 58, .10), transparent 68%),
    radial-gradient(44% 38% at -4% 104%, rgba(166, 5, 37, .11), transparent 70%);
}

.corner {
  position: absolute;
  width: 22px;
  height: 22px;
  border-style: solid;
  border-color: var(--red);
  z-index: 3;
}
.corner.tl { top: 36px; left: 36px; border-width: 2px 0 0 2px; }
.corner.br { bottom: 36px; right: 36px; border-width: 0 2px 2px 0; }

.lockup {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.wordmark {
  display: block;
  width: 760px;
  height: auto;
}

.tag {
  margin-top: 28px;
  font-size: 20px;
  font-weight: 300;
  letter-spacing: .08em;
  color: rgba(246, 248, 250, .62);
}

.meta {
  margin-top: 36px;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--slate);
}

.foot {
  position: absolute;
  left: 48px;
  right: 48px;
  bottom: 38px;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--slate);
}
</style>
</head>
<body>

<div class="card">
  <span class="corner tl"></span>
  <span class="corner br"></span>

  <div class="lockup">
    <img class="wordmark" src="assets/wordmark.png" alt="PowerBee">
    <p class="tag">Ultra efficient energy generation</p>
    <p class="meta">Investor deck · Confidential</p>
  </div>

  <div class="foot">
    <span>PowerBee P.S.A.</span>
    <span>Invitation only</span>
  </div>
</div>

</body>
</html>
